[project]
name = "typesafe-computer-use"
version = "0.2.0"
description = "Cheap, fast computer use on macOS and Windows: deterministic screen state, a TypeSafe classifier for every decision, a writer model only for free text."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Aaron Levin" }]
keywords = ["computer-use", "automation", "ocr", "typesafe", "macos", "windows", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "anthropic==1.6.0",
    "openai==2.54.0",
    "pillow>=11.0,<13",
    "typesafe-sdk==0.6.0",
    "websocket-client==1.9.0",
    "pyobjc-framework-ApplicationServices==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
    "psutil==7.2.2; sys_platform == 'win32'",
    "pywin32==312; sys_platform == 'win32'",
    "uiautomation==2.0.29; sys_platform == 'win32'",
    # The desktop perception: text, the icon detector, and the icon captioner. Neither PyTorch nor ONNX
    # Runtime ships a wheel for an Intel Mac, so none of these installs there: jev still imports and its
    # tests still run, but the desktop path does not.
    "rapidocr==3.9.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime==1.30.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch==2.15.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision==0.29.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers==5.22.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "huggingface-hub==2.4.0",
    "numpy==2.5.3",
]

[tool.uv.sources]
# Linux runs the WAA client container and the sandbox, neither with a GPU: the CPU build spares a few GB of CUDA.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Homepage = "https://github.com/awlevin/typesafe-computer-use"
Issues = "https://github.com/awlevin/typesafe-computer-use/issues"

[project.scripts]
clicker = "typesafe_computer_use.cli:main"
clicker-inspect = "typesafe_computer_use.cli:inspect"
clicker-bench = "typesafe_computer_use.browser.bench:main"
clicker-perception-eval = "typesafe_computer_use.perception_eval:main"
clicker-models = "typesafe_computer_use.parse.weights:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typesafe_computer_use"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".agents", ".claude", ".private"]  # local agent folders: worktrees with their own venvs, links that may dangle

[tool.ruff.format]
# The copy of WindowsAgentArena's runner, kept line for line with upstream so that taking an update
# is a re-copy: formatting it would bury the few jev changes in a diff of the whole file.
exclude = ["waa_overlay/run.py", "waa_overlay/upstream/run.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Only what WindowsAgentArena's own code in that copy trips at the pinned commit; every other rule
# still checks the jev changes. A WAA update may add a code here, and nothing else.
"waa_overlay/run.py" = [
    "E722", "F401", "F541", "I001", "RUF059", "SIM102", "SIM108", "SIM115", "UP015", "UP031", "UP032",
]
"waa_overlay/upstream/run.py" = [
    "E722", "F401", "F541", "I001", "RUF059", "SIM102", "SIM108", "SIM115", "UP015", "UP031", "UP032",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
